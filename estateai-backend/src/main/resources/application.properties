spring.application.name=estateai-backend

# Server Configuration (Port 8085 avoids conflicts with local Oracle TNSLSNR listener on 8080)
server.port=${PORT:8085}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/estateai}}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
application.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.estateai=INFO
logging.level.org.springframework.security=INFO
